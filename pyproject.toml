[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dogdb"
version = "0.1.0"
description = "Deterministic SQL fault injection for tests"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["sqlglot>=30.12.0,<31"]

[project.optional-dependencies]
duckdb = ["duckdb"]

[dependency-groups]
dev = ["pytest", "duckdb", "flask>=3.1,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
