[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dogdb"
version = "0.1.0"
description = "Deterministic SQL fault injection for tests"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["duckdb", "sqlglot>=30.12.0,<31"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
venvPath = "."
venv = ".venv"
